name: flags
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  drag_and_drop:
    path: packages/drag_and_drop

  bloc_utils:
    git:
      url: https://github.com/dipflix/bloc_utils.git

  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  flame_audio: ^2.11.3
  add_to_cart_animation: ^2.0.3
  defer_pointer:
    path: packages/defer_pointer
  gesture_x_detector: ^1.1.1
  flame: ^1.18.0
  flutter_svg: ^2.0.9
  touchable: ^1.0.2
  particle_field: ^1.0.0
  flutter_animate: ^4.4.0
  widgets_to_image: ^0.0.2
  assorted_layout_widgets: ^9.0.1
  rx_shared_preferences: ^3.1.0
  flutter_animator: ^3.2.2
  animate_do: ^3.1.2
  path_provider: ^2.1.2
  dart_numerics: ^0.0.6
  dough: ^2.0.0
  statsfl: ^2.3.0
  matrix4_transform: ^3.0.1
  rxdart: ^0.27.7
  color: ^3.0.0
  simple_shadow: ^0.3.1
  flutter_shaders: ^0.1.2
  color_filter_extension: ^0.0.2
  image: ^4.1.7
  vibration: ^3.1.8
  community_material_icon: ^5.9.55
  showcaseview:
    path: packages/showcaseview
  flutter_easyloading: ^3.0.5
  flutter_screenutil: ^5.9.3
  reactive_forms: ^17.0.1
  multi_value_listenable_builder: ^0.0.2
  memoize: ^3.0.0
  logger: ^2.3.0
  searchable_listview: ^2.14.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  flutter_colorpicker: ^1.1.0
  image_gallery_saver:
    git:
      url: https://github.com/knottx/image_gallery_saver.git
      ref: knottx-latest
  file_picker: ^8.1.2
  pointer_interceptor: ^0.10.1+2
  get_it: ^8.0.3
  flutter_secure_storage: ^9.2.3
  auto_route: ^9.2.2
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  auto_route_generator: ^9.0.0

  lint: ^2.3.0
  flutter_lints: ^2.0.0


flutter:
  uses-material-design: true
  shaders:
    - shaders/antialias.frag
    - shaders/sprite.frag
    - shaders/pixel_fade.frag
    - shaders/outline.frag

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/continents/
    - assets/images/emblems/
    - assets/images/ui/
    - assets/audio/music/
    - assets/audio/sfx/

  fonts:
    - family: Troika
      fonts:
        - asset: assets/fonts/Troika.otf
