name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [optimization]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned: newer Flutter (3.47+) needs Gradle 8.14+, the project uses 8.11.1.
      # 3.41.x matches pubspec.lock (flutter >=3.41.0, dart >=3.11.0).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # .env is not committed; the example file holds Google's test AdMob ids.
      - name: Create .env from example
        run: cp .env.example .env

      - run: flutter --version
      - run: flutter pub get

      # *.gr.dart / *.g.dart / *.freezed.dart are gitignored and must be generated.
      - name: Generate code (auto_route, freezed, json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # Without android/app/key.properties the build is signed with the debug key.
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: APK contents (x86_64, biggest entries)
        run: |
          python3 - <<'PY'
          import zipfile, collections
          z = zipfile.ZipFile('build/app/outputs/flutter-apk/app-x86_64-release.apk')
          grp = collections.Counter()
          for i in z.infolist():
              parts = i.filename.split('/')
              grp['/'.join(parts[:4] if parts[0] == 'assets' else parts[:2])] += i.compress_size
          print('TOTAL %.2f MB' % (sum(grp.values()) / 1e6))
          for k, v in grp.most_common(20):
              print('%7.2f MB  %s' % (v / 1e6, k))
          print('--- biggest files (stored MB / raw MB)')
          for i in sorted(z.infolist(), key=lambda i: -i.compress_size)[:25]:
              print('%6.2f %6.2f  %s' % (i.compress_size / 1e6, i.file_size / 1e6, i.filename))
          PY

      - name: Upload x86_64 APK (emulator)
        uses: actions/upload-artifact@v4
        with:
          name: flags-x86_64-emulator
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload arm64 APK (real devices)
        uses: actions/upload-artifact@v4
        with:
          name: flags-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  # Launch the APK on old and new Android emulators and make sure it gets past
  # the native launch splash (BlueStacks runs Android 9).
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28, 30]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: flags-x86_64-emulator
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke_test.sh apk/app-x86_64-release.apk smoke-out

      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-${{ matrix.api-level }}
          path: smoke-out

